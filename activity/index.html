<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Activity Report</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="../icon-180.png"><link rel="icon" href="../favicon-32.png"><meta name="theme-color" content="#1f4fd0">
<style>:root{
  --blue:#1f4fd0; --blue-d:#0f3aa8; --ink:#1b2436; --muted:#6b7488; --line:#e3e9f3;
  --bg:#eef3fb; --card:#fff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#dfe7f4;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;color:var(--ink)}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
#app{max-width:430px;margin:0 auto;min-height:100%;background:var(--bg);position:relative;overflow-x:hidden}

/* 히어로 */
.hero{position:relative;height:175px;overflow:hidden}
.hero svg.bg{position:absolute;inset:0;width:100%;height:100%}
.hero h1{position:absolute;left:24px;top:68px;margin:0;font-size:35px;font-weight:800;letter-spacing:-.5px;color:#111a33}
.hero p{position:absolute;left:24px;top:116px;margin:0;font-size:16px;color:#3a4560;font-weight:500}
.bell{position:absolute;right:20px;top:calc(14px + env(safe-area-inset-top));width:46px;height:46px;border-radius:50%;background:#fff;box-shadow:0 4px 12px #1a3a7a30;display:grid;place-items:center}
.bell svg{width:24px;height:24px}.bell i{position:absolute;right:11px;top:9px;width:9px;height:9px;border-radius:50%;background:#f33}

/* 본문 시트 */
.sheet{position:relative;margin-top:-18px;background:#f7faff;border-radius:26px 26px 0 0;padding:14px 14px 150px;box-shadow:0 -6px 20px #2a4a8a18}
.seg{display:flex;background:#fff;border-radius:999px;padding:5px;box-shadow:inset 0 0 0 1px var(--line),0 3px 10px #2a4a8a14}
.seg button{flex:1;height:44px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:17px;font-weight:700;color:#4a5570;transition:.2s}
.seg button svg{width:26px;height:26px}
.seg button.on{background:linear-gradient(180deg,#2d65e0,#123aa6);color:#fff;box-shadow:0 5px 12px #1f4fd055}

.sec-h{display:flex;align-items:center;gap:8px;margin:18px 4px 12px}
.sec-h b{font-size:24px;font-weight:800;padding-left:10px;border-left:5px solid var(--blue);line-height:1;letter-spacing:-.5px}
.sec-h .ln{flex:1;height:1px;background:var(--line);margin:0 6px}
.sec-h .cnt{font-size:16px;color:#5a6580}.sec-h .cnt strong{color:var(--blue);font-size:21px}

/* 카드 그리드 */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{position:relative;background:#fff;border-radius:18px;padding:0 0 10px;text-align:left;overflow:hidden;box-shadow:0 3px 12px #2a4a8a1c;border:2px solid transparent;transition:.15s}
.card:active{transform:scale(.97)}
.card.sel{border-color:var(--blue);box-shadow:0 0 0 3px #1f4fd024,0 6px 16px #1f4fd030}
.card .corner{position:absolute;left:0;top:0;width:60%;height:46%;background:linear-gradient(135deg,var(--c),transparent 70%);opacity:.9;border-radius:0 0 100% 0}
.card .ill{position:relative;height:84px;margin:4px 6px 0}
.card .ill svg{width:100%;height:100%}
.card .nm{position:relative;padding:0 8px 0 10px;font-size:12.8px;font-weight:800;letter-spacing:-.9px;white-space:nowrap}
.card .row{position:relative;display:flex;align-items:center;justify-content:space-between;padding:4px 8px 0 10px}
.card .row span{font-size:12px;white-space:nowrap;color:var(--muted)}
.card .go{width:30px;height:30px;border-radius:50%;background:#e9edff;color:#1f3fd0;display:grid;place-items:center;box-shadow:0 2px 6px #1f4fd030}
.card .go svg{width:15px;height:15px}
.card .tick{position:absolute;right:8px;top:8px;width:22px;height:22px;border-radius:50%;background:var(--blue);display:none;place-items:center}
.card.sel .tick{display:grid}.tick svg{width:13px;height:13px}

/* 서브유형 요약 */
.subbox{margin-top:16px;background:#fff;border-radius:18px;box-shadow:0 3px 12px #2a4a8a14;overflow:hidden}
.subbox .hd{display:flex;align-items:center;gap:8px;padding:10px 12px 8px;background:#f1f4fa}
.subbox .hd>svg{width:28px;height:28px;flex:none;color:#3a4258}
.subbox .hd b{font-size:17px;font-weight:800;white-space:nowrap}.subbox .hd small{white-space:nowrap;color:var(--muted);font-size:11.5px;border-left:1px solid var(--line);padding-left:8px}
.subbox .hd .all{margin-left:auto;background:#fff;border-radius:999px;padding:7px 10px;font-size:13px;white-space:nowrap;font-weight:600;display:flex;align-items:center;gap:2px;box-shadow:0 1px 4px #0001}
.subbox .hd .all svg{width:12px;height:12px;color:#333}
.subbox .bd{display:grid;grid-template-columns:1fr 1fr;padding:8px 10px 14px;gap:0 6px}
.subbox ul{list-style:none;margin:0;padding:0}.subbox li{display:flex;align-items:center;gap:8px;height:34px;font-size:15px;white-space:nowrap;font-weight:500}
.dot{width:25px;height:25px;border-radius:50%;background:#fff;box-shadow:0 2px 6px #0002;display:grid;place-items:center}
.dot::after{content:"";width:17px;height:17px;border-radius:50%;background:var(--d)}

/* 하단 CTA / 내비 */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;pointer-events:none}
.cta{pointer-events:auto;display:flex;align-items:center;justify-content:center;gap:12px;width:calc(100% - 28px);margin:0 14px 10px;height:62px;border-radius:999px;color:#fff;font-size:22px;font-weight:800;position:relative;
  background:linear-gradient(90deg,#1f55d8 0%,#6a3fd0 45%,#f0662f 78%,#f5b021 100%);box-shadow:0 8px 20px #3a4fd04a;transition:.2s}
.cta svg.d{width:26px;height:26px}.cta svg.c{position:absolute;right:20px;width:20px;height:20px;color:#fff}
.cta:disabled{filter:grayscale(.85) opacity(.55);box-shadow:none}
.nav{pointer-events:auto;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-radius:26px 26px 0 0;box-shadow:0 -4px 18px #2a4a8a22;padding:12px 0 calc(10px + env(safe-area-inset-bottom))}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:15px;color:#8591a8;position:relative}
.nav button+button::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:1px;background:var(--line)}
.nav svg{width:38px;height:38px}
.nav button.on{color:var(--blue)}.nav button.on::after{content:"";position:absolute;left:18%;right:18%;bottom:-8px;height:3px;background:var(--blue);border-radius:3px}

/* 서브유형 시트(바텀시트) */
.mask{position:fixed;inset:0;background:#0a1430aa;display:none;z-index:20}
.mask.open{display:block}
.pop{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:100%;max-width:430px;background:#fff;border-radius:26px 26px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));z-index:21;transition:transform .25s}
.pop.open{transform:translate(-50%,0)}
.pop h3{margin:0 0 4px;font-size:21px}.pop p{margin:0 0 12px;color:var(--muted);font-size:14px}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:14px;margin-bottom:8px;background:#f4f7fd;font-size:17px;font-weight:600;text-align:left;border:2px solid transparent}
.opt b{width:34px;height:34px;border-radius:10px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:14px}
.opt.sel{border-color:var(--blue);background:#eaf0ff}
.opt.todo{color:#8a93a8}.opt.todo b{background:#aab4c9}

/* 2단계 안내 화면 */
.step2{padding:20px 18px 40px;min-height:100vh;background:var(--bg)}
.step2 .top{display:flex;align-items:center;gap:6px;margin-bottom:18px}
.step2 .top button{width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 2px 8px #0001}.step2 .top svg{width:20px;height:20px}
.step2 h2{margin:0;font-size:20px}
.tbox{background:#fff;border-radius:18px;padding:18px;box-shadow:0 3px 12px #2a4a8a1c}
.tbox label{font-size:13px;color:var(--muted);font-weight:700}
.tbox .t{margin-top:8px;font-size:19px;font-weight:800;line-height:1.5;color:var(--blue-d);word-break:keep-all}
.tbox .t em{font-style:normal;color:#8a93a8;font-weight:600}
.note{margin-top:14px;padding:14px;border-radius:14px;background:#fff7e6;color:#8a5a00;font-size:14.5px;line-height:1.55}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.chips span{background:#e9edff;color:var(--blue-d);padding:7px 12px;border-radius:999px;font-weight:700;font-size:14px}

@media (min-width:431px){#app{box-shadow:0 0 40px #1a3a7a30}}

/* 2단계 양식 */
.fm{padding-bottom:40px}.fm h4{margin:18px 14px 8px;font-size:16px}.fm h4 small{font-weight:500;color:var(--muted);font-size:12px;margin-left:6px}
.fbox,.fm .fr,.fm .photo,.fm .mr,.fm .sum{margin:8px 14px}
.fr{display:flex;flex-wrap:wrap;gap:8px}
.fd{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}.fd span{font-weight:600}
.w1{flex:1 1 30%}.w2{flex:1 1 46%}.w4{flex:1 1 100%}
.fm input,.fm select,.fm textarea{width:100%;font:inherit;font-size:15px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.chk{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:14px}.chk input{width:18px;height:18px;flex:none}
.strip{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.strip button{flex:1;padding:9px 6px;border:1px solid var(--ink);background:#fff;font-size:13px;border-radius:4px}.strip button.y{background:#ffff00;font-weight:700}
.photo{background:#fff;border:1px dashed #9db3d8;border-radius:12px;padding:10px;text-align:center;color:var(--muted);font-size:13px}.photo img{max-width:100%;max-height:240px;border-radius:8px}
.pbtn{display:inline-block;margin-top:8px;padding:9px 14px;background:var(--blue);color:#fff;border-radius:999px;font-weight:600;font-size:14px}
.mr{background:#fff;border-radius:12px;padding:10px;box-shadow:0 1px 4px #1a3a7a18;display:flex;flex-direction:column;gap:6px}.mh{font-weight:700;font-size:14px}
.m4{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.m4 input:last-child{grid-column:1/-1}
.sum{text-align:right;font-size:15px}.xl{margin:20px 14px 6px;width:calc(100% - 28px);position:static}.msg{text-align:center;color:var(--muted);font-size:13px;margin:6px 14px}

.pbs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.pbtn.alt{background:#fff;color:var(--blue);box-shadow:inset 0 0 0 1.5px var(--blue)}

.fm input.af{background:#fff8c5;border-color:#e6c200}

details.mat{margin:18px 14px 8px}details.mat summary{font-size:16px;font-weight:700;cursor:pointer;list-style:none;padding:10px 12px;background:#fff;border-radius:12px;box-shadow:0 1px 4px #1a3a7a18}
details.mat summary::-webkit-details-marker{display:none}details.mat summary:before{content:"▸ ";color:var(--blue)}details.mat[open] summary:before{content:"▾ "}
details.mat summary small{font-weight:500;color:var(--muted);font-size:12px;margin-left:4px}details.mat .mr{margin:8px 0}
.li{display:flex;gap:6px;align-items:flex-start;margin:6px 14px}.li b{padding-top:9px;font-size:15px}.li textarea{flex:1}
.x{width:32px;height:36px;border-radius:8px;background:#fff;border:1px solid var(--line);color:var(--muted)}
.addb{display:block;margin:6px 14px;width:calc(100% - 28px);padding:9px;border:1px dashed #9db3d8;border-radius:10px;background:#fff;color:var(--blue);font-weight:600}

details.mg,details.mi{margin:8px 0}
details.mg>summary,details.mi>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;font-weight:700;padding:11px 12px;background:#fff;border-radius:12px;box-shadow:0 1px 4px #1a3a7a18;font-size:14px}
details.mg>summary{font-size:15px;background:#e3edff}
details>summary::-webkit-details-marker{display:none}
details.mg>summary:before,details.mi>summary:before{content:"▸";color:var(--blue)}
details.mg[open]>summary:before,details.mi[open]>summary:before{content:"▾"}
details.mg>details.mi{margin-left:10px}
.mgs{font-weight:500;color:var(--muted);font-size:12px}
.mib{margin-left:auto;font-style:normal;font-size:12px;font-weight:600;color:var(--muted)}.mib.on{color:var(--blue)}
.fm details.mi .mr{margin:6px 0 4px;box-shadow:none;border:1px solid var(--line)}
.mctl{display:flex;gap:8px;margin:8px 0}.mctl button{flex:1;padding:9px;border-radius:10px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--blue)}
.sph{margin-bottom:8px}.sph small{color:var(--muted);font-size:12px}
.spg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.spv{height:110px;border:2px dashed var(--line);border-radius:10px;display:grid;place-items:center;color:var(--muted);font-size:13px;overflow:hidden;background:#f7f9fd}
.spv img{width:100%;height:100%;object-fit:cover}
.sps .pbs{margin-top:6px}.sps .pbtn{font-size:12px;padding:8px 6px}.spx[hidden]{display:none}
.photo.one{display:flex;align-items:center;gap:6px;padding:8px 10px;text-align:left}
.photo.one .pbtn{flex:1;margin:0;padding:9px 4px;font-size:12px;white-space:nowrap;text-align:center}
.photo.one .pt{font-size:13px;white-space:nowrap}
.fm .photo.one #pv img,.fm .photo.one .sth img{width:22px;height:22px;object-fit:cover;border-radius:4px;vertical-align:middle;margin:0}
.fm .photo.one #pv img{width:34px;height:34px}
.sth{font-style:normal}
.photo.one .spx{flex:none;padding:8px 10px}
.sx{display:grid;grid-template-columns:1fr 1fr;gap:6px}.sx .fd{min-width:0}
.sx output{display:block;padding:9px 2px;font-weight:700;color:var(--ink);font-size:15px}
.fm .mh .x{height:28px}

/* 미리보기 · 보관함 */
.act{display:flex;gap:8px;margin:14px 14px 0}.act button{flex:1;padding:11px 4px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:14px;font-weight:700;color:var(--blue);box-shadow:0 1px 4px #1a3a7a18}
.act button:last-child{color:var(--muted);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1b2436;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;z-index:99;max-width:88vw;text-align:center;box-shadow:0 6px 18px #0004;transition:opacity .4s}.toast.off{opacity:0}
.pvm{position:fixed;inset:0;z-index:60;background:#dfe7f4;display:flex;flex-direction:column;max-width:100%}
.pvh{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:#fff;box-shadow:0 1px 6px #1a3a7a22}.pvh button{width:36px;height:36px;border-radius:50%;background:#eef3fb;font-size:16px}.pvh b{font-size:16px}
.pvb{flex:1;overflow:auto;padding:8px}.pvz{width:720px;transform-origin:0 0}
.pvf{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#fff;box-shadow:0 -1px 6px #1a3a7a22}.pvf button{flex:1;padding:12px;border-radius:12px;background:#fff;border:1.5px solid var(--blue);color:var(--blue);font-weight:700;font-size:15px}.pvf button.pri{background:var(--blue);color:#fff}
.pp{width:720px;background:#fff;color:#000;padding:20px;font:12px/1.45 "Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;box-shadow:0 2px 10px #1a3a7a22}
.pp table{border-collapse:collapse;width:100%;table-layout:fixed}.pp th,.pp td{border:1px solid #000;padding:5px 4px;text-align:center;word-break:break-all;vertical-align:middle}.pp th{background:#f2f2f2;font-weight:600}
.pp td.l{text-align:left}.pp .yl{background:#ff0;font-weight:700}.pp .rd{color:#e00}.pp .tb{border:2px solid #000;margin-bottom:6px}.pp .sg{border:2px solid #000}
.pp .pt1{font-size:15px;font-weight:700;margin-bottom:10px}.pp h5{margin:14px 0 5px;font-size:13px}.pp h5 .un{float:right;font-weight:400;font-size:11px}.pp .nt{color:#2457b8;font-size:11px;margin:-4px 0 6px}
.pp .ln{padding:3px 2px;min-height:20px}.pp .tx{border:2px solid #000;padding:8px 10px;min-height:56px;white-space:pre-wrap}
.pp .ovw{display:flex}.pp .ovl{flex:0 0 58%}.pp .ovr{flex:1;border:2px solid #000;border-left:0;display:flex;flex-direction:column}.pp .ih{background:#f2f2f2;text-align:center;font-weight:600;padding:5px;border-bottom:1px solid #000}.pp .ib{flex:1;display:flex;gap:3px;padding:2px;min-height:120px}.pp .ib img{flex:1;min-width:0;object-fit:cover;max-height:none}
.pp .ib2{display:flex;border:2px solid #000;min-height:120px;margin-top:-6px}.pp .ib2>div{flex:1;display:grid;place-items:center;color:#888;border-right:1px solid #000}.pp .ib2>div:last-child{border-right:0}.pp .ib2 img{width:100%;height:100%;object-fit:cover}
.lst{padding-bottom:150px}.lst .fbox{margin:10px 14px}.lst input[type=search]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;font:inherit;font-size:15px;background:#fff}
.lf{display:flex;gap:6px;overflow-x:auto;padding:0 14px 4px}.lf button{flex:none;padding:7px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}.lf button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.lcnt{margin:8px 16px;font-size:12px;color:var(--muted)}
.ri{background:#fff;border-radius:14px;margin:8px 14px;padding:10px;box-shadow:0 2px 8px #1a3a7a18;display:grid;grid-template-columns:62px 1fr;gap:4px 10px}
.ri .th{width:62px;height:62px;border-radius:10px;background:#eef3fb;overflow:hidden;display:grid;place-items:center}.ri .th img,.ri .th svg{width:100%;height:100%;object-fit:cover}
.ri .bd{min-width:0}.ri .tt{display:block;font-size:14px;line-height:1.35;word-break:break-all}.ri small{color:var(--muted);font-size:12px}
.ri .ra{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}.ri .ra button{flex:1 1 auto;padding:8px 6px;border-radius:9px;background:#f4f7fc;border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--blue)}.ri .ra button[data-a=del]{color:#d33}
.empty{margin:36px 24px;text-align:center;color:var(--muted);line-height:1.7}
.bk2{display:flex;gap:8px;margin:16px 14px 6px}.bk2 button,.bk2 .bkl{flex:1;padding:11px;border-radius:12px;background:#fff;border:1.5px solid var(--blue);color:var(--blue);font-weight:700;font-size:14px;text-align:center}
.hint{margin:6px 18px;color:var(--muted);font-size:12px;line-height:1.6}

/* 메인 화면: 스크롤 없이 한 화면에 (시안 비율 유지) */
#app.fit{height:100vh;height:100dvh;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.fit .hero{flex:none;height:clamp(88px,13.6dvh,150px)}
.fit .hero h1{top:auto;bottom:clamp(34px,5.4dvh,52px);font-size:clamp(23px,3.7dvh,34px)}
.fit .hero p{top:auto;bottom:clamp(14px,2.4dvh,26px);font-size:clamp(12px,1.8dvh,15px)}
.fit .bell{width:38px;height:38px;top:calc(8px + env(safe-area-inset-top))}.fit .bell svg{width:20px;height:20px}
.fit .sheet{flex:1;min-height:0;display:flex;flex-direction:column;padding:8px 12px 6px;margin-top:-16px}
.fit .seg{flex:none;padding:3px}.fit .seg button{height:clamp(34px,4.8dvh,42px);font-size:15.5px}.fit .seg button svg{width:21px;height:21px}
.fit .sec-h{flex:none;margin:clamp(6px,1.1dvh,12px) 4px clamp(5px,.9dvh,9px)}.fit .sec-h b{font-size:clamp(16px,2.4dvh,21px)}.fit .sec-h .cnt{font-size:13.5px}.fit .sec-h .cnt strong{font-size:17px}
.fit .grid{flex:1;min-height:0;grid-template-rows:repeat(3,minmax(0,1fr));gap:7px}
.fit .card{height:100%;display:flex;flex-direction:column;padding:0 0 4px;border-radius:15px}
.fit .card .ill{flex:1;min-height:0;height:auto;margin:3px 6px 1px}
.fit .card .nm{font-size:clamp(10px,2.95vw,12.2px);letter-spacing:-1.1px;padding:0 2px 0 9px;line-height:1.2}

<script>// 보관함(Rep): 저장·미리보기·백업 — 이 기기(휴대폰/PC) 브라우저의 IndexedDB 에 보관
window.Rep = (function () {
  let dbp;
  const open = () => dbp || (dbp = new Promise((ok, no) => { try { const q = indexedDB.open('activity-reports', 1); q.onupgradeneeded = () => q.result.createObjectStore('r', { keyPath: 'id' }); q.onsuccess = () => ok(q.result); q.onerror = () => no(q.error); } catch (e) { no(e); } }));
  const tx = async (mode, fn) => { const db = await open(); return new Promise((ok, no) => { const t = db.transaction('r', mode), r = fn(t.objectStore('r')); t.oncomplete = () => ok(r && r.result); t.onerror = () => no(t.error); t.onabort = () => no(t.error); }); };
  const uid = () => 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const R = {
    all: async () => (await tx('readonly', s => s.getAll())) || [],
    del: id => tx('readwrite', s => s.delete(id)),
    put: rec => tx('readwrite', s => s.put(rec)),
    async save(rec) { rec = Object.assign({}, rec, { id: rec.id || uid(), ts: Date.now() }); await tx('readwrite', s => s.put(rec)); try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {} return rec; },
    toast(m) { const o = document.querySelector('.toast'); if (o) o.remove(); const e = document.createElement('div'); e.className = 'toast'; e.textContent = m; document.body.appendChild(e); setTimeout(() => e.classList.add('off'), 2600); setTimeout(() => e.remove(), 3100); },
    async download(name, data, type) {
      let dl = null; try { dl = await window.claude.use('downloads'); } catch (e) {}
      if (dl) { await dl.save({ filename: name, data }); return; }
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    },
    preview(html, o = {}) {
      const el = document.createElement('div'); el.className = 'pvm';
      el.innerHTML = `<div class="pvh"><button type="button" data-a="c" aria-label="닫기">✕</button><b>보고서 미리보기</b></div><div class="pvb"><div class="pvz"><div class="pp">${html}</div></div></div><div class="pvf">${o.onSave ? '<button type="button" data-a="s">💾 저장</button>' : ''}${o.onExcel ? '<button type="button" data-a="x" class="pri">📊 Excel 만들기</button>' : ''}</div>`;
      document.body.appendChild(el); document.body.style.overflow = 'hidden';
      const fit = () => { el.querySelector('.pvz').style.zoom = Math.min(1, (el.clientWidth - 16) / 720); };
      const close = () => { removeEventListener('resize', fit); el.remove(); document.body.style.overflow = ''; };
      fit(); addEventListener('resize', fit);
      el.onclick = async e => { const b = e.target.closest('button'); if (!b) return; const a = b.dataset.a;
        if (a === 'c') close();
        else if (a === 's') await o.onSave();
        else if (a === 'x') { try { await o.onExcel(); R.toast('Excel 파일을 만들었어요'); } catch (err) { R.toast('실패: ' + (err && err.message || err)); } } };
    }
  };
  return R;
})();
</script>

    }).join('');
  }

  const HERO2 = `<svg class="art" viewBox="0 0 390 150" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2=".9"><stop offset="0" stop-color="#0a3bc0"/><stop offset=".55" stop-color="#1f66e8"/><stop offset="1" stop-color="#63a6f8"/></linearGradient><linearGradient id="gl" x1="0" x2="1"><stop offset="0" stop-color="#86b4f3"/><stop offset="1" stop-color="#d4e7ff"/></linearGradient><linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#06278f" stop-opacity=".55"/><stop offset=".75" stop-color="#06278f" stop-opacity="0"/></linearGradient><pattern id="wd" width="6" height="7" patternUnits="userSpaceOnUse"><rect x="1" y="1.2" width="3.6" height="4.4" fill="#eef6ff" opacity=".85"/></pattern></defs><rect width="390" height="150" fill="url(#hg)"/><rect width="390" height="150" fill="url(#sh)"/><ellipse cx="70" cy="34" rx="90" ry="26" fill="#fff" opacity=".08"/><ellipse cx="300" cy="24" rx="84" ry="18" fill="#fff" opacity=".1"/><g id="bl"><rect x="236" y="62" width="28" height="100" fill="url(#gl)"/><rect x="268" y="30" width="38" height="130" fill="url(#gl)"/><rect x="310" y="66" width="28" height="100" fill="url(#gl)"/><rect x="342" y="44" width="34" height="120" fill="url(#gl)"/><rect x="378" y="74" width="22" height="90" fill="url(#gl)"/></g><use href="#bl" fill="url(#wd)"/><g fill="url(#wd)"><rect x="236" y="62" width="28" height="100"/><rect x="268" y="30" width="38" height="130"/><rect x="310" y="66" width="28" height="100"/><rect x="342" y="44" width="34" height="120"/><rect x="378" y="74" width="22" height="90"/></g><path d="M0 140c90-12 170-6 390-22v40H0z" fill="#2e8a4e" opacity=".5"/><g transform="rotate(-32 30 70)" fill="#fff" opacity=".4"><rect x="-10" y="48" width="60" height="20" rx="9"/><rect x="16" y="66" width="7" height="34" rx="3"/></g></svg>`;
  const V2 = {
    A: ['현장 방문 및 판촉 활동', '<rect x="8" y="22" width="12" height="22" fill="#2f6df0"/><rect x="22" y="14" width="14" height="30" fill="#4a82f2"/><rect x="38" y="26" width="12" height="18" fill="#7aa2f6"/><path d="M14 20V6h22M30 6v8M16 6l-6 6" stroke="#1e5be6" stroke-width="2.4" fill="none"/><g fill="#fff"><rect x="10" y="26" width="3" height="3"/><rect x="15" y="26" width="3" height="3"/><rect x="25" y="19" width="3" height="3"/><rect x="30" y="19" width="3" height="3"/><rect x="25" y="25" width="3" height="3"/><rect x="30" y="25" width="3" height="3"/></g><rect x="4" y="44" width="52" height="2.5" fill="#1e5be6"/>'],
    B: ['거래처 방문 및 관리', '<path d="M6 16l12-4 10 8-8 10-10-6z" fill="#1e5be6"/><path d="M58 16l-12-4-10 8 8 10 10-6z" fill="#2f6df0"/><path d="M20 20l12-8 12 8-8 14-8 4-8-6z" fill="#5b8def"/><path d="M26 30l6 5 8-7" stroke="#fff" stroke-width="2" fill="none"/>'],
    C: ['제품 판매 확대 활동', '<rect x="10" y="30" width="9" height="14" fill="#5b8def"/><rect x="24" y="22" width="9" height="22" fill="#2f6df0"/><rect x="38" y="12" width="9" height="32" fill="#1e5be6"/><path d="M8 24L24 12l10 6 22-12" stroke="#2f6df0" stroke-width="3" fill="none"/><path d="M48 4h10v10z" fill="#2f6df0"/>'],
    D: ['제품 간 연계 영업', '<path d="M16 24L32 10l16 14-16 14z" stroke="#7aa2f6" stroke-width="3" fill="none"/><circle cx="16" cy="24" r="8" fill="#2f6df0"/><circle cx="32" cy="10" r="7" fill="#1e5be6"/><circle cx="48" cy="24" r="8" fill="#2f6df0"/><circle cx="32" cy="38" r="7" fill="#1e5be6"/>'],
    E: ['사업부별 운영 활동', '<circle cx="32" cy="14" r="7" fill="#1e5be6"/><path d="M19 42c0-9 6-14 13-14s13 5 13 14z" fill="#1e5be6"/><circle cx="14" cy="20" r="5.5" fill="#5b8def"/><path d="M4 42c0-7 4-11 10-11 2 0 4 .6 5 1.6-3 3-4 6.6-4 9.4z" fill="#5b8def"/><circle cx="50" cy="20" r="5.5" fill="#5b8def"/><path d="M60 42c0-7-4-11-10-11-2 0-4 .6-5 1.6 3 3 4 6.6 4 9.4z" fill="#5b8def"/>'],
    F: ['건의 및 지원 활동', '<rect x="14" y="4" width="28" height="38" rx="3" fill="#2f6df0"/><path d="M20 14h16M20 20h16M20 26h10" stroke="#fff" stroke-width="2"/><path d="M34 40l14-18 6 5-14 18-8 2z" fill="#1e5be6" stroke="#fff" stroke-width="1.5"/>'],
    G: ['신제품 개발 및 도입', '<path d="M32 4a14 14 0 00-8 25c2 2 2 4 2 6h12c0-2 0-4 2-6A14 14 0 0032 4z" fill="#2f6df0"/><rect x="26" y="37" width="12" height="4" rx="2" fill="#1e5be6"/><rect x="28" y="42" width="8" height="3" rx="1.5" fill="#1e5be6"/><g stroke="#5b8def" stroke-width="2.6" stroke-linecap="round"><path d="M10 14l5 3M54 14l-5 3M6 28h6M52 28h6"/></g>'],
    H: ['보고 및 제안 활동', '<rect x="16" y="3" width="30" height="40" rx="3" fill="#2f6df0"/><path d="M22 12h18M22 18h18M22 24h10" stroke="#fff" stroke-width="2"/><g fill="#9dbcf7"><rect x="23" y="32" width="4" height="7"/><rect x="30" y="28" width="4" height="11"/><rect x="37" y="30" width="4" height="9"/></g>'],
    I: ['지점장 주관 활동', '<circle cx="32" cy="13" r="9" fill="#1e5be6"/><path d="M10 44c0-12 9-19 22-19s22 7 22 19z" fill="#2f6df0"/><path d="M28 27l4 8 4-8" fill="#fff"/><path d="M32 33l-2 9h4z" fill="#1e5be6"/>']
  };
  const STEPS = ['활동 유형', '세부 선택', '정보 입력', '보고서 생성'];
  const arrow = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg>';

  function cardHTML(t) {
    const v = V2[t.code] || ['', ''];
    return `<button class="tc${state.major === t.code ? ' sel' : ''}" data-code="${t.code}">
      <i class="bd">${t.code}</i><i class="tk">${I.check}</i>
      <div class="ic"><svg viewBox="0 0 64 48" aria-hidden="true">${v[1]}</svg></div>
      <div class="tn">${t.name}</div><div class="td">${v[0]}</div><span class="go">${I.chev}</span>
    </button>`;
  }

  function home() {
    app.className = 'v2';
    const s = state.step === 2 && state.major ? 2 : 1, t0 = find(state.major);
    const total = T.filter(t => !t.direct).reduce((n, t) => n + t.subs.length, 0);
    const picked = s === 2 && t0 && state.sub != null && !t0.direct ? `${subCode(t0, state.sub)} ${t0.subs[state.sub]}` : '';
    app.innerHTML = `
      <header class="h2">${HERO2}
        <div class="brand"><b>COAT ON</b><span>Activity Report</span></div>
        <div class="tools"><button id="arch" aria-label="보고서 보관함">${I.doc}</button><button id="gear" aria-label="설정">${I.gear}</button></div>
        <div class="ttl"><h1>${s === 1 ? '활동 유형 설정' : '세부 유형 선택'}</h1><p>${s === 1 ? '활동 목적을 선택하시면<br>해당 양식으로 보고서를 작성할 수 있습니다.' : '선택한 활동의 세부 항목을 고르면<br>입력 양식이 열립니다.'}</p></div>
      </header>
      <main class="sh">
        <ol class="steps">${STEPS.map((n, k) => `<li class="${k + 1 === s ? 'on' : k + 1 < s ? 'done' : ''}" data-s="${k + 1}"><i>${k + 1 < s ? I.check : k + 1}</i><span>${n}</span></li>`).join('')}</ol>
        ${s === 1 ? `<div class="tg">${T.map(cardHTML).join('')}</div>
          <div class="info"><i>i</i><div><b>선택 안내</b><span>선택한 활동 유형에 따라 입력 항목과 보고서 양식이 자동으로 변경됩니다.</span></div></div>`
        : `<div class="sec-h"><b>세부 유형</b><span class="ln"></span><span class="cnt pill">전체 <strong>${total}</strong>개 항목</span></div><div class="scrl">${groupCards()}</div>`}
      </main>
      <div class="dk">${s === 2 ? '<button class="prev" id="prev">이전</button>' : ''}<button class="next" id="done" ${s === 1 ? (state.major ? '' : 'disabled') : (picked || (t0 && t0.direct) ? '' : 'disabled')}><span id="ct">${s === 2 && picked ? '다음 단계 · ' + picked : '다음 단계'}</span>${arrow}</button></div>
      <div class="mask" id="mask"></div><div class="pop" id="pop"></div>`;
    bind();
  }

  function bind() {
    $('#arch').onclick = listScreen;
    $('#gear').onclick = () => window.Rep.toast('설정은 준비 중이에요');
    app.querySelectorAll('.steps li.done').forEach(li => li.onclick = () => { state.step = 1; home(); });
    app.querySelectorAll('.tc').forEach(c => c.onclick = () => {
      const t = find(c.dataset.code); if (state.major !== t.code) state.sub = null; state.major = t.code; state.step = 1; save(); home();
    });
    app.querySelectorAll('.gh').forEach(h => h.onclick = () => { const g = h.parentElement, c = g.dataset.code; g.classList.toggle('shut'); if (g.classList.contains('shut')) shut.add(c); else shut.delete(c); });
    app.querySelectorAll('.gr').forEach(r => r.onclick = () => {
      const t = find(r.dataset.code); state.major = r.dataset.code; state.sub = r.dataset.i === '' ? null : +r.dataset.i; save();
      app.querySelectorAll('.gr.sel').forEach(x => x.classList.remove('sel')); r.classList.add('sel');
      $('#done').disabled = false; $('#ct').textContent = '다음 단계 · ' + (t.direct ? t.title : subCode(t, state.sub) + ' ' + t.subs[state.sub]);
    });
    const pv = $('#prev'); if (pv) pv.onclick = () => { state.step = 1; home(); };
    $('#done').onclick = () => {
      const t = find(state.major); if (!t) return;
      if (state.step !== 2 && !t.direct) { state.step = 2; state.sub = null; shut.clear(); T.forEach(x => { if (x.code !== t.code) shut.add(x.code); }); home(); return; }
      if (!t.direct && state.sub == null) return;
      state.step = t.direct ? 1 : 2; step2(t);
    };
  }

  function step2(t) {
    state.screen = 'step2'; app.className = '';
    if (t.direct || window.READY.has(subCode(t, state.sub || 0))) {
      return window.Forms.render(app, t, state.sub || 0, I, () => { state.screen = 'home'; if (state.from === 'list') { state.from = null; listScreen(); } else home(); }, n => { state.sub = n; save(); if (window.READY.has(subCode(t, n))) step2(t); else { step2(t); } });
    }
    const i = state.sub || 0, name = t.direct ? t.name : t.subs[i];
    const ttl = titleOf(t, i).replace(/(\[[^\]]+\]|현장명_활동 내용|활동 내용)/g, '<em>$1</em>');
    app.innerHTML = `<div class="step2">
      <div class="top"><button id="bk" aria-label="뒤로">${I.back}</button><h2>${t.code}${t.direct ? '' : (i + 1)}. ${name}</h2></div>
      <div class="tbox"><label>제목 (자동 생성)</label><div class="t">${ttl}</div>
        <div class="chips"><span>① 제목</span><span>② 본문 : 구분 및 내용</span></div></div>
      <div class="note">다음 단계: 유형별 보고서 양식(현장 개요 · 자재 정보 등)과 공사 개요판 사진 인식 입력이 이 화면에 연결됩니다.<br>양식을 보내주시면 ${t.code}${t.direct ? '' : (i + 1)} 화면부터 구현합니다.</div>
    </div>`;
    $('#bk').onclick = () => { state.screen = 'home'; home(); };
    window.scrollTo(0, 0);
  }

  let LQ = '', LF = '';
  async function listScreen() {
    state.screen = 'list'; state.from = null; app.className = '';
    let recs = [], err = '';
    try { recs = (await window.Rep.all()).sort((a, b) => b.ts - a.ts); } catch (e) { err = '이 브라우저에서는 보관함을 쓸 수 없어요: ' + (e.message || e); }
    const E = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
    const D = ts => { const d = new Date(ts), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}.${p(d.getMonth() + 1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
    const thumb = r => { const dd = r.data || {}, x = (dd.sp && dd.sp.find(Boolean)) || dd.photo || (dd.imgs && Object.values(dd.imgs).find(Boolean)); const t = find(r.code[0]); return x ? `<img src="${x}" alt="">` : (t ? I[t.icon] : ''); };
    const eng = r => r.eng === 'A' ? window.Forms.A : window.Forms.S;
    app.innerHTML = `<div class="step2 lst">
      <div class="top"><button id="bk" aria-label="뒤로">${I.back}</button><h2>보고서 보관함</h2></div>
      <div class="fbox"><input id="lq" type="search" placeholder="제목·유형으로 검색" value="${E(LQ)}"></div>
      <div class="lf" id="lf"></div><div class="lcnt" id="lc"></div><div id="rl"></div>
      ${err ? `<div class="note">${E(err)}</div>` : ''}
      <div class="bk2"><button type="button" id="exp">⬇ 백업 파일 저장</button><label class="bkl">⬆ 백업 가져오기<input type="file" accept=".json,application/json" id="imp" hidden></label></div>
      <p class="hint">보고서는 <b>지금 쓰는 이 휴대폰/PC의 브라우저</b>에 저장돼요. 다른 기기로 옮기거나 안전하게 보관하려면 백업 파일을 저장한 뒤 다른 기기에서 가져오기 하세요. 브라우저 데이터를 지우면 보고서도 함께 지워져요.</p>
      <div class="dock"><nav class="nav"><button id="nh">${I.home}홈</button><button class="on">${I.bars}보고서</button><button>${I.star}즐겨찾기</button><button>${I.gear}설정</button></nav></div></div>`;
    const paint = () => {
      const q = LQ.trim().toLowerCase(), cnt = {}; recs.forEach(r => { cnt[r.code[0]] = (cnt[r.code[0]] || 0) + 1; });
      $('#lf').innerHTML = `<button data-f="" class="${LF ? '' : 'on'}">전체 ${recs.length}</button>` + Object.keys(cnt).sort().map(c => `<button data-f="${c}" class="${LF === c ? 'on' : ''}">${c}. ${E(find(c) ? find(c).name : c)} ${cnt[c]}</button>`).join('');
      const shown = recs.filter(r => (!LF || r.code[0] === LF) && (!q || (r.title + ' ' + r.sub + ' ' + r.code).toLowerCase().includes(q)));
      $('#lc').textContent = `${shown.length}건 · 최근 수정순`;
      $('#rl').innerHTML = shown.length ? shown.map(r => `<div class="ri" data-id="${r.id}"><div class="th">${thumb(r)}</div><div class="bd"><b class="tt">${E(r.title)}</b><small>${E(r.code)} · ${E(r.sub)} · ${D(r.ts)}</small></div>
        <div class="ra"><button data-a="open">✏ 열기</button><button data-a="pv">👁 미리보기</button><button data-a="xl">📊 Excel</button><button data-a="dup">⧉ 복제</button><button data-a="del">🗑 삭제</button></div></div>`).join('')
        : `<div class="empty">${recs.length ? '검색 결과가 없어요.' : '저장된 보고서가 없어요.<br>작성 화면에서 <b>💾 저장</b>을 누르면 여기에 쌓여요.'}</div>`;
    };
    paint();
    $('#bk').onclick = $('#nh').onclick = () => { state.screen = 'home'; home(); };
    $('#lq').oninput = e => { LQ = e.target.value; paint(); };
    $('#lf').onclick = e => { const b = e.target.closest('button'); if (!b) return; LF = b.dataset.f; paint(); };
    $('#rl').onclick = async e => {
      const b = e.target.closest('button'), row = e.target.closest('.ri'); if (!b || !row) return;
      const r = recs.find(x => x.id === row.dataset.id); if (!r) return;
      const a = b.dataset.a;
      try {
        if (a === 'open') { const t = find(r.code[0]); eng(r).open(r); state.major = t.code; state.sub = +r.code.slice(1) - 1; state.tab = 'major'; save(); state.from = 'list'; step2(t); }
        else if (a === 'pv') window.Rep.preview(eng(r).preview(r), { onExcel: () => eng(r).excel(r) });
        else if (a === 'xl') { window.Rep.toast('Excel 만드는 중…'); await eng(r).excel(r); window.Rep.toast('Excel 파일을 만들었어요'); }
        else if (a === 'dup') { await window.Rep.save(Object.assign({}, r, { id: undefined })); window.Rep.toast('복제했어요'); listScreen(); }
        else if (a === 'del') { if (!confirm('이 보고서를 삭제할까요?\n삭제하면 되돌릴 수 없어요.\n\n' + r.title)) return; await window.Rep.del(r.id); window.Rep.toast('삭제했어요'); listScreen(); }
      } catch (err) { window.Rep.toast('실패: ' + (err && err.message || err)); }
    };
    $('#exp').onclick = async () => {
      if (!recs.length) return window.Rep.toast('저장된 보고서가 없어요');
      const d = new Date(), p = n => String(n).padStart(2, '0');
      try { await window.Rep.download(`Activity_Report_backup_${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}.json`, new TextEncoder().encode(JSON.stringify({ app: 'activity-report', v: 1, recs })), 'application/json'); window.Rep.toast('백업 파일을 저장했어요'); } catch (e) { window.Rep.toast('백업 실패: ' + (e && e.message || e)); }
    };
    $('#imp').onchange = async e => {
      const fl = e.target.files[0]; if (!fl) return;
      try { const j = JSON.parse(await fl.text()), arr = Array.isArray(j.recs) ? j.recs : []; let n = 0;
        for (const r of arr) if (r && r.id && r.code && r.data && (r.eng === 'A' || r.eng === 'S')) { await window.Rep.put(Object.assign({ ts: Date.now(), title: '', sub: '' }, r)); n++; }
        window.Rep.toast(n ? `${n}건을 가져왔어요` : '가져올 보고서가 없어요'); listScreen(); } catch (err) { window.Rep.toast('가져오기 실패: 백업 파일이 올바르지 않아요'); }
    };
    window.scrollTo(0, 0);
  }

  home();
})();
</script>
<script src="material.js"></script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});</script></body></html>
